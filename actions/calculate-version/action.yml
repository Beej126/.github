name: "Calculate Next Version Tag"
description: "Queries git tags and outputs the next semver tag and Windows file version."

outputs:
  new_tag:
    value: ${{ steps.calc.outputs.new_tag }}
  semver:
    value: ${{ steps.calc.outputs.semver }}
  win_file_version:
    value: ${{ steps.calc.outputs.win_file_version }}

runs:
  using: "composite"
  steps:
    - name: Validate Git Checkout Configuration
      shell: bash
      run: |
        has_error=false

        # Check 1: Verify full git history was fetched (fetch-depth: 0)
        is_shallow="$(git rev-parse --is-shallow-repository 2>/dev/null || echo "false")"
        if [ "$is_shallow" = "true" ]; then
          echo "::error::[GIT CHECKOUT ERROR] Shallow repository detected!"
          has_error=true
        fi

        # Check 2: Verify git tags were fetched (fetch-tags: true)
        tag_count=$(git tag | wc -l)
        
        # Safely check remote tags only if origin remote is configured
        remote_tags=""
        if git remote get-url origin >/dev/null 2>&1; then
          remote_tags="$(git ls-remote --tags origin 2>/dev/null || true)"
        fi

        # If it's not a shallow repo but zero tags are visible despite remote tags existing, fetch-tags was omitted
        if [ "$tag_count" -eq 0 ] && [ -n "$remote_tags" ]; then
          echo "::error::[GIT CHECKOUT ERROR] Remote tags exist, but no local tags were found!"
          has_error=true
        fi

        # If validation fails, print exact YAML block fix and terminate pipeline
        if [ "$has_error" = "true" ]; then
          echo ""
          echo "=================================================================================="
          echo "  MISSING REQUIRED CHECKOUT CONFIGURATION IN PROJECT WORKFLOW"
          echo "=================================================================================="
          echo "Please update your actions/checkout step in your project workflow file to match:"
          echo ""
          echo "    - uses: actions/checkout@v4"
          echo "      with:"
          echo "        fetch-depth: 0"
          echo "        fetch-tags: true"
          echo ""
          echo "=================================================================================="
          echo ""
          exit 1
        fi

        echo "SUCCESS: Git checkout configuration validated (full depth and tags present)."

    - name: Calculate Version
      id: calc
      shell: bash
      run: |
        # Get latest tag, fallback to 1.0.0 if no tags exist
        last_tag="$(git describe --abbrev=0 --tags $(git rev-list --tags --max-count=1 2>/dev/null) 2>/dev/null || echo "1.0.0")"

        # Strip leading 'v' if present
        clean_release="${last_tag#v}"

        # Parse semver parts
        major=$(echo "$clean_release" | cut -d'.' -f1)
        minor=$(echo "$clean_release" | cut -d'.' -f2)
        patch=$(echo "$clean_release" | cut -d'.' -f3)

        # Fallbacks if cut fails to find parts
        major=${major:-1}
        minor=${minor:-0}
        patch=${patch:-0}

        # Increment patch version
        new_patch=$((patch + 1))

        new_semver="${major}.${minor}.${new_patch}"
        win_ver="${new_semver}.0"

        echo "new_tag=v${new_semver}" >> "$GITHUB_OUTPUT"
        echo "semver=${new_semver}" >> "$GITHUB_OUTPUT"
        echo "win_file_version=${win_ver}" >> "$GITHUB_OUTPUT"