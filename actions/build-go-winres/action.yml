name: "Build Go Winres Executable"
description: "Injects versioning metadata and builds a Windows executable."

inputs:
  output_binary:
    description: "Name of the compiled binary"
    required: true
  semver:
    description: "Semantic version tag (e.g. 1.0.1)"
    required: true
  win_file_version:
    description: "Windows file version format (e.g. 1.0.1.0)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install go-winres
      shell: bash
      run: go install github.com/tc-hib/go-winres@latest

    - name: Apply Windows Resource Versioning
      shell: bash
      run: |
        if [ -f "winres.json" ]; then
          go-winres make --in winres.json --product-version "${{ inputs.win_file_version }}" --file-version "${{ inputs.win_file_version }}"
        elif [ -f "winres/winres.json" ]; then
          go-winres make --product-version "${{ inputs.win_file_version }}" --file-version "${{ inputs.win_file_version }}"
        else
          echo "::notice::No winres.json found. Skipping Windows resource embedding."
        fi

    - name: Cross-Compile Windows Binary
      shell: bash
      run: |
        env GOOS=windows GOARCH=amd64 go build -v -o "${{ inputs.output_binary }}"