name: "Build Go Executable with Winres"
description: "Applies Windows resource versioning and builds a Go executable into dist/"

inputs:
  binary_name:
    description: "Name of the output binary (without .exe extension)"
    required: true
  win_file_version:
    description: "4-part Windows file version (e.g. 1.0.1.0)"
    required: false
    default: "1.0.0.0"

outputs:
  binary_path:
    description: "Path to the built executable"
    value: ${{ steps.build.outputs.binary_path }}

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: "go.mod"
        cache: true

    - name: Install go-winres
      shell: bash
      run: go install github.com/tc-hib/go-winres@latest

    - name: Apply Windows Resource Versioning
      shell: bash
      run: |
        if [ -f "winres.json" ]; then
          go-winres make --in winres.json --product-version "${{ inputs.win_file_version }}" --file-version "${{ inputs.win_file_version }}"
        elif [ -f "winres/winres.json" ]; then
          go-winres make --product-version "${{ inputs.win_file_version }}" --file-version "${{ inputs.win_file_version }}"
        else
          echo "::notice::No winres.json found. Skipping Windows resource embedding."
        fi

    - name: Cross-Compile Windows Binary
      id: build
      shell: bash
      run: |
        mkdir -p dist
        OUT_PATH="dist/${{ inputs.binary_name }}.exe"
        GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o "$OUT_PATH"
        echo "binary_path=$OUT_PATH" >> "$GITHUB_OUTPUT"