name: "Generate Release Notes & Publish"
description: "Builds commit-based changelog and publishes a GitHub Release with optional binaries attached."

inputs:
  tag_name:
    description: "The release tag to create (e.g., v1.0.1)"
    required: true
  artifacts:
    description: "Space-separated paths or glob patterns of build artifacts to attach"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Generate Release Notes
      id: releaseNotes
      uses: mikepenz/release-changelog-builder-action@v5
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        mode: "COMMIT"
        outputFile: notes.md

    - name: Create GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        artifacts_str="${{ inputs.artifacts }}"

        if [ -n "$artifacts_str" ]; then
          # Read space-separated artifact string into a bash array
          read -r -a artifact_args <<< "$artifacts_str"
          gh release create "${{ inputs.tag_name }}" "${artifact_args[@]}" --notes-file notes.md
        else
          gh release create "${{ inputs.tag_name }}" --notes-file notes.md
        fi